<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Curae</title>
    <script type="text/javascript">
      // Fallback de SPA para GitHub Pages (github.com/rafgraph/spa-github-pages).
      // pathSegmentsToKeep = 1 na URL de teste futuro-tech.github.io/curae-website/,
      // 0 no domínio próprio (onde o app fica na raiz).
      var pathSegmentsToKeep = location.hostname === 'futuro-tech.github.io' ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
